name: Feature request
description: Suggest an idea or an improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, for example "As a site owner I want to ... because ...".
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How could it work? Charts, settings, pages or log formats you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workarounds you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links, the web servers or log formats it concerns.
